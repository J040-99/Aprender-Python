<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos e Dúvidas</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1 class="titulo">Envia a tua Dúvida</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="licoes.html">Lições</a></li>
                <li><a href="recursos.html">Recursos</a></li>
                <li><a href="contactos.html">Contactos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="formulario-contacto">
            <h2>Preenche o formulário abaixo</h2>
            <p>Campos marcados com <span class="negrito">*</span> são obrigatórios.</p>

            <form id="formulario" onsubmit="enviarMensagem(event)">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: João Silva">

                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="Ex: joao@email.com">

                <label for="senha">Palavra-passe (para área reservada)</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres">

                <label for="assunto">Nível de Conhecimento</label>
                <select id="assunto" name="assunto">
                    <option value="iniciante">Iniciante absoluto</option>
                    <option value="basico">Já sei o básico</option>
                    <option value="intermedio">Intermédio</option>
                </select>

                <label for="mensagem">Mensagem / Dúvida *</label>
                <textarea id="mensagem" name="mensagem" rows="5" required
                    placeholder="Escreve aqui a tua dúvida..."></textarea>

                <label>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Quero receber novas lições por email
                </label>

                <button type="submit">Enviar Mensagem</button>
                <button type="reset" style="background-color: #cc0000; margin-left: 10px;">Limpar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>📍 Escola Secundária Henriques Nogueia | Redes de Comunicação</p>
        <p class="texto-pequeno">Feito por: João Ricardo e Rúben Marques</p>
    </footer>

    <script>
        function enviarMensagem(event) {
            event.preventDefault();
            // Redirecionar para a página de sucesso
            window.location.href = "sucesso.html";
        }
    </script>
</body>

</html>
